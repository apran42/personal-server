<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Note10 NAS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
      color: #1f2937;
      background: #f3f4f6;
      font-family: system-ui, sans-serif;
    }

    header,
    .upload-box,
    .file-list {
      padding: 18px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 8px #00000012;
    }

    header {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    h1 {
      margin: 0;
    }

    a {
      color: #2563eb;
    }

    input,
    button {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font: inherit;
    }

    button {
      color: white;
      background: #2563eb;
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.6;
    }

    .upload-box form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .upload-box input {
      flex: 1;
      min-width: 220px;
    }

    .path-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    #current-path {
      overflow-wrap: anywhere;
      font-family: monospace;
    }

    .entry {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
    }

    .entry:last-child {
      border-bottom: 0;
    }

    .entry-name {
      overflow-wrap: anywhere;
    }

    .directory {
      color: #1d4ed8;
      cursor: pointer;
      font-weight: 600;
    }

    .size,
    .date {
      color: #6b7280;
      font-size: 13px;
    }

    .message {
      margin-top: 12px;
    }

    .error {
      color: #dc2626;
    }

    @media (max-width: 600px) {
      .entry {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Note10 NAS</h1>
    <a href="/">메모 대시보드</a>
  </header>

  <section class="upload-box">
    <h2>파일 업로드</h2>

    <form id="upload-form">
      <input id="files" type="file" multiple required>
      <button id="upload-button" type="submit">업로드</button>
    </form>

    <div id="message" class="message"></div>
  </section>

  <section class="file-list">
    <div class="path-bar">
      <button id="up-button" type="button">상위 폴더</button>
      <span id="current-path">/</span>
    </div>

    <div id="entries">불러오는 중...</div>
  </section>

  <script>
    const entriesElement = document.querySelector("#entries");
    const pathElement = document.querySelector("#current-path");
    const messageElement = document.querySelector("#message");
    const uploadForm = document.querySelector("#upload-form");
    const uploadButton = document.querySelector("#upload-button");
    const upButton = document.querySelector("#up-button");

    let currentPath = "";

    function formatSize(bytes) {
      if (bytes === null) return "";

      const units = ["B", "KB", "MB", "GB"];
      let value = bytes;
      let unitIndex = 0;

      while (value >= 1024 && unitIndex < units.length - 1) {
        value /= 1024;
        unitIndex += 1;
      }

      return `${value.toFixed(unitIndex === 0 ? 0 : 1)} ${units[unitIndex]}`;
    }

    function parentPath(value) {
      const parts = value.split("/").filter(Boolean);
      parts.pop();
      return parts.join("/");
    }

    async function loadFiles(path = "") {
      currentPath = path;
      pathElement.textContent = `/${currentPath}`;
      upButton.disabled = currentPath === "";
      entriesElement.textContent = "불러오는 중...";

      try {
        const response = await fetch(
          `/nas/files?path=${encodeURIComponent(currentPath)}`
        );

        if (!response.ok) {
          throw new Error("파일 목록을 가져오지 못했습니다.");
        }

        const result = await response.json();
        entriesElement.replaceChildren();

        if (result.files.length === 0) {
          entriesElement.textContent = "빈 폴더입니다.";
          return;
        }

        for (const entry of result.files) {
          const row = document.createElement("div");
          row.className = "entry";

          const name = document.createElement(
            entry.type === "file" ? "a" : "span"
          );

          name.className = "entry-name";
          name.textContent =
            entry.type === "directory"
              ? `📁 ${entry.name}`
              : `📄 ${entry.name}`;

          if (entry.type === "directory") {
            name.classList.add("directory");
            name.addEventListener("click", () => {
              loadFiles(entry.path);
            });
          } else {
            name.href =
              `/nas/download?path=${encodeURIComponent(entry.path)}`;
          }

          const size = document.createElement("span");
          size.className = "size";
          size.textContent = formatSize(entry.size);

          const date = document.createElement("span");
          date.className = "date";
          date.textContent = new Date(entry.modifiedAt).toLocaleString("ko-KR");

          row.append(name, size, date);
          entriesElement.append(row);
        }
      } catch (error) {
        entriesElement.textContent = error.message;
      }
    }

    upButton.addEventListener("click", () => {
      loadFiles(parentPath(currentPath));
    });

    uploadForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const input = document.querySelector("#files");
      const formData = new FormData();

      for (const file of input.files) {
        formData.append("files", file);
      }

      uploadButton.disabled = true;
      messageElement.className = "message";
      messageElement.textContent = "업로드 중...";

      try {
        const response = await fetch(
          `/nas/upload?dir=${encodeURIComponent(currentPath || "Uploads")}`,
          {
            method: "POST",
            body: formData
          }
        );

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || "업로드에 실패했습니다.");
        }

        messageElement.textContent =
          `${result.uploaded.length}개 파일을 업로드했습니다.`;

        input.value = "";

        await loadFiles(currentPath || "Uploads");
      } catch (error) {
        messageElement.className = "message error";
        messageElement.textContent = error.message;
      } finally {
        uploadButton.disabled = false;
      }
    });

    loadFiles();
  </script>
</body>
</html>
