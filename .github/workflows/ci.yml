name: Server CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check Node.js server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: |
          npm run format:check
          docker run --rm \
            -v "$PWD:/mnt" \
            -w /mnt \
            mvdan/shfmt:v3.13.1 \
            -d -i 4 -ci scripts/*.sh

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check auth.js
          node --check nas.js
          node --check system.js
          node --check resources.js
          node --check resource-index.js
          node --check resource-paths.js
      - name: Run server smoke test
        run: npm test
      - name: Check required files
        run: |
          test -f public/index.html
          test -f public/nas.html
          test -f public/system.html
          test -f scripts/backup-db.sh
          test -f scripts/check-device-status.sh
          test -f scripts/smoke-test.sh
          test -f .env.example
          test -f resources.js
          test -f public/resources.html
          test -f resource-paths.js
          test -f resource-index.js
